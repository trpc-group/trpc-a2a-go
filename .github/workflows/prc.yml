name: Pull Request Check
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read # Use with `only-new-issues` option.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version: 1.20.14
    - name: Build
      run: GOWORK=off go build -v ./...
    - name: Test
      run: GOWORK=off go test -v -coverprofile=coverage.out ./...
    - name: Test examples
      working-directory: examples
      run: GOWORK=off go test ./...
    - name: Configure Redis module workspace
      run: |
        go work init . ./taskmanager/redis
        go work edit -replace=trpc.group/trpc-go/trpc-a2a-go/v2@v2.0.0-alpha.3=.
    - name: Build Redis module
      working-directory: taskmanager/redis
      run: go build -v ./...
    - name: Test Redis module
      working-directory: taskmanager/redis
      run: go test -v ./...
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: coverage.out
        flags: unittests
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  examples-multi:
    name: examples/multi
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version: 1.23.7
    - name: Test
      working-directory: examples/multi
      run: go test ./...
  modules-tidy:
    name: modules tidy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version: 1.24.4
    - name: Check root module
      run: GOWORK=off go mod tidy -diff
    - name: Check Redis module
      working-directory: taskmanager/redis
      run: |
        cp go.mod go.ci.mod
        cp go.sum go.ci.sum
        go mod edit -modfile=go.ci.mod \
          -replace=trpc.group/trpc-go/trpc-a2a-go/v2=${GITHUB_WORKSPACE}
        go mod tidy -modfile=go.ci.mod -diff
        rm go.ci.mod go.ci.sum
    - name: Check examples module
      working-directory: examples
      run: GOWORK=off go mod tidy -diff
    - name: Check examples/multi module
      working-directory: examples/multi
      run: GOWORK=off go mod tidy -diff
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: 1.21
      - uses: actions/checkout@v3
      - name: Configure Redis module workspace
        run: |
          go work init . ./taskmanager/redis
          go work edit -replace=trpc.group/trpc-go/trpc-a2a-go/v2@v2.0.0-alpha.3=.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest 
          only-new-issues: true
          args: --skip-files=.*_test.go
      - name: golangci-lint Redis module
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          only-new-issues: true
          working-directory: taskmanager/redis
          args: --skip-files=.*_test.go
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: typos 
      uses: crate-ci/typos@master
  go-apidiff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 
    - uses: actions/setup-go@v4
      with:
        go-version: 1.21
    - uses: joelanford/go-apidiff@main
