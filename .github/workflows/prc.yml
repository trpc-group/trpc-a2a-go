name: Pull Request Check
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read # Use with `only-new-issues` option.
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version: 1.20.14
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v -coverprofile=coverage.out ./...
    - name: Test examples
      working-directory: examples
      run: go test ./...
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: coverage.out
        flags: unittests
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  examples-multi:
    name: examples/multi
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version: 1.23.7
    - name: Test
      working-directory: examples/multi
      run: go test ./...
  modules-tidy:
    name: modules tidy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version: 1.24.4
    - name: Check root module
      run: go mod tidy -diff
    - name: Check examples module
      working-directory: examples
      run: go mod tidy -diff
    - name: Check examples/multi module
      working-directory: examples/multi
      run: go mod tidy -diff
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: 1.21
      - uses: actions/checkout@v3
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest 
          only-new-issues: true
          args: --skip-files=.*_test.go
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: typos 
      uses: crate-ci/typos@master
  go-apidiff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 
    - uses: actions/setup-go@v4
      with:
        go-version: 1.21
    - uses: joelanford/go-apidiff@main
