site_name: tRPC-A2A-Go
site_url: https://trpc-group.github.io/trpc-a2a-go/
repo_url: https://github.com/trpc-group/trpc-a2a-go
repo_name: trpc-group/trpc-a2a-go
edit_uri: edit/v2/docs/mkdocs/
docs_dir: mkdocs/

nav:
  - Home: index.md
  - Overview: overview.md
  - Protocol: protocol.md
  - Behavior: behavior.md
  - Usage: usage.md
  - Migrating from v0.x: migration.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: zh
          name: 中文
          build: true
          nav:
            - 首页: index.md
            - 框架概览: overview.md
            - 协议: protocol.md
            - 框架行为: behavior.md
            - 使用指南: usage.md
            - 从 v0.x 迁移: migration.md
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_datetime

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.tabs
    - search.suggest
    - search.share
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
